keys:
  - &admin_ogama age1770ph0u393hjkl58jvt6ng7guej2tj463xx85avr5khwm4g3hejsq26efx
  - &host_oserv age120ez2v3ptnmd2eq9gxenfpmfvduemfta9k2eg65a4m5k8whha4fqy3ux62
  # ogama_serv's own home-manager sops-nix identity (~/.config/sops/age/keys.txt
  # on oserv) — separate from host_oserv, which is only readable by root and
  # can't be used by the unprivileged home-manager --user sops-nix.service.
  - &user_ogama_serv age1ta05f5qnxmwgj06n4kxw7k4jgl9sqkvnyw3k5wfyawr3fta0suqq5xqxrj

creation_rules:
  - path_regex: sops/wakatime\.yaml$
    key_groups:
      - age:
          - *admin_ogama
          - *user_ogama_serv
  - path_regex: sops/proton-calendar\.yaml$
    key_groups:
      - age:
          - *admin_ogama
  - path_regex: sops/oserv\.yaml$
    key_groups:
      - age:
          - *admin_ogama
          - *host_oserv
